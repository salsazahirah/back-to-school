<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ad.orientation" content="portrait,landscape">
    <meta name="google" content="notranslate" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>160x600 Banner</title>
    
    <!-- Required Google Ads clickTag definition -->
    <script type="text/javascript">
        var clickTag = "https://gemini.google/id/students/?hl=id";
    </script>

    <!-- Official Google Ads Exit API Script -->
    <script src="https://tpc.googlesyndication.com/pagead/gadgets/html5/api/exitapi.js" type="text/javascript"></script>

    <script src="js/gsap.min.js"></script>
    <script src="js/SplitText.min.js"></script>
    
    <style>
        @font-face {
            font-family: "Google Sans Flex";
            src: url("assets/google-sans-flex.woff2") format("woff2");
            font-weight: 100 1000;
            font-style: normal;
        }
        :root {
            --google-blue: #4285F4;
            --google-green: #0F9D58;
            --google-red: #DB4437;
            --google-yellow: #F4B400;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: "Google Sans Flex", sans-serif;
            font-optical-sizing: auto;
        }
        a {
            color: inherit;
            text-decoration: inherit;
        }
        img {
            width: 100%;
        }
        #banner {
            width: 160px;
            height: 600px;
            background-image: url("assets/bg.png");
            background-size: cover;
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            gap: 20px;
        }
        #logo {
            width: 100px;
            margin-left: -10px;
        }
        .txt {
            color: #fff;
            font-variation-settings: "opsz" 144, "wdth" 47, "wght" 700, "GRAD" 37, "ROND" 0, "slnt" 0;
            font-size: 32px;
            text-align: center;
            line-height: 0.9;
        }
        .sup {
            font-size: 16px;
            vertical-align: super;
        }
        .crossed {
            position: relative;
        }
        .line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            margin: 0 auto;
            width: 80%;
            height: 5px;
            background-color: #E81C53;
            transform: rotate(-6deg) translate(2px, -2px);
            border-radius: 5px;
        }
        #line {
            clip-path: inset(0% 100% 0% 0%);
        }
        .main-img {
            position: relative;
            width: 145px;
            height: 120px;
            overflow: hidden;
            background: #000;
            margin-bottom: 10px;
            margin-left: -10px;
        }
        .fade-img {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0), rgba(0, 0, 0, 1));
            z-index: 1;
        }
        .cta {
            display: flex;
            align-items: center;
            z-index: 2;
            overflow:visible;
        }
        .cta::before {
            content: "";
            position: absolute;
            z-index: -1;
            background: linear-gradient(to right, var(--google-blue), var(--google-green), var(--google-yellow), var(--google-red));
            border-radius: 20px;
            filter: blur(10px);
            inset: -2px -4px;
            opacity: var(--glow-opacity, 0);
            transform: translateZ(0);
        }
        .cta-text {
            background-color: #fff;
            font-size: 8px;
            display: flex;
            align-items: center;
            padding: 6px 12px;
            border-radius: 20px;
            z-index: 2;
            text-align: center;
        }
        .link {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .main-img-a {
            width: 200px;
        }
        .main-img-b {
            position: absolute;
            top: 28px;
            width: 125px;
            left: 10px;
        }
        .main-img-c {
            width: 5px;
            position: absolute;
            top: 17px;
            left: 17px;
            transform: rotate(45deg);
        }
    </style>
</head>
<body>
    <div id="banner">
        <div id="logo">
            <img src="assets/gemini-logo.png" alt="Gemini Logo" loading="lazy">
        </div>
        <div class="txt">
            <div class="split-top">
                <div class="line-text">PAKET</div>
                <div class="line-text">MAHASISWA</div>
                <div class="line-text">1 TAHUN</div>
                <div class="line-text crossed" >
                    <span class="sup">RP</span>900.000
                    <div id="line" class="line"></div>
                </div>
            </div>
            <div class="split-bottom">
                <div class="line-text">GRATIS</div>
            </div>
        </div>
        <div class="link"></div>
    </div>
    <script>
        gsap.registerPlugin(SplitText);

        let splitTop = SplitText.create(".split-top", { type: "lines", linesClass: "line-text" });
        let splitBottom = SplitText.create(".split-bottom", { type: "lines", linesClass: "line-text" });

        const tl = gsap.timeline();

        tl.from(splitTop.lines, {
            scale: 1.2, opacity: 0, stagger: {
                amount: 0.8, from: "start", ease: "cubic-bezier(0.4, 0, 0.2, 1)"
            }
        })
        .from(splitBottom.lines, {
            scale: 1.2, opacity: 0, stagger: {
                amount: 0.2, from: "start", ease: "cubic-bezier(0.4, 0, 0.2, 1)"
            },
            onComplete: () => {
                lineLoopTl.play();
            }
        });

        tl.play();

        const lineLoopTl = gsap.timeline({ paused: true, repeat: -1, repeatDelay: 3 });
        gsap.set("#line", { clipPath: "inset(0% 100% 0% 0%)" });

        lineLoopTl.to("#line", { 
            duration: 0.5, 
            clipPath: "inset(0% 0% 0% 0%)", 
            ease: "cubic-bezier(0.4, 0, 0.2, 1)" 
        });

        const banner = document.getElementById("banner");
        let isHoverAnimating = false;

        banner.addEventListener("mouseenter", () => {
            if (tl.isActive()) return;
            tl.restart();
            lineLoopTl.restart();
            if (isHoverAnimating) return;
            isHoverAnimating = true;
        });
        
        document.querySelector(".link").addEventListener("click", () => {
            ExitApi.exit();
        });
    </script>
</body>
</html>
