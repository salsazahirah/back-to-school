<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>970x90 Banner</title>
    <script src="https://cdn.jsdelivr.net/gh/salsazahirah/assets@main/js/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/salsazahirah/assets@main/js/SplitText.min.js"></script>
    
    <style>
        @font-face {
            font-family: "Google Sans Flex";
            src: url("https://cdn.jsdelivr.net/gh/salsazahirah/assets@main/fonts/google-sans-flex-latin-full-normal.woff2") format("woff2");
            font-weight: 100 1000;
            font-style: normal;
        }
        :root {
            --google-blue: #4285F4;
            --google-green: #0F9D58;
            --google-red: #DB4437;
            --google-yellow: #F4B400;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: "Google Sans Flex", sans-serif;
            font-optical-sizing: auto;
        }
        a {
            color: inherit;
            text-decoration: inherit;
        }
        img {
            width: 100%;
        }
        #banner {
            width: 970px;
            height: 90px;
            background-image: url("assets/bg.png");
            background-size: cover;
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            gap: 120px
        }
        #logo {
            width: 160px;
        }
        .txt {
            color: #fff;
            font-variation-settings: "opsz" 144, "wdth" 47, "wght" 700, "GRAD" 37, "ROND" 0, "slnt" 0;
            font-size: 36px;
            text-align: center;
            line-height: 0.9;
        }
        .sup {
            font-size: 20px;
            vertical-align: super;
        }
        .crossed {
            position: relative;
        }
        .line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            margin: 0 auto;
            width: 100%;
            height: 6px;
            background-color: #E81C53;
            transform: rotate(-6deg) translate(2px, -2px);
            border-radius: 6px;
        }
        #line {
            clip-path: inset(0% 100% 0% 0%);
        }
        .main-img {
            position: relative;
            width: 360px;
            height: 150px;
            overflow: hidden;
            background: #000;
            margin-bottom: 10px;
        }
        .fade-img {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0), rgba(0, 0, 0, 1));
            z-index: 1;
        }
        .cta {
            display: flex;
            align-items: center;
            z-index: 2;
            overflow:visible;
        }
        .cta::before {
            content: "";
            position: absolute;
            z-index: -1;
            background: linear-gradient(to right, var(--google-blue), var(--google-green), var(--google-yellow), var(--google-red));
            border-radius: 20px;
            filter: blur(10px);
            inset: -2px -4px;
            opacity: var(--glow-opacity, 0);
            transform: translateZ(0);
        }
        .cta-text {
            background-color: #fff;
            font-size: 12px;
            display: flex;
            align-items: center;
            padding: 8px 14px;
            border-radius: 20px;
            z-index: 2;
        }
        .link {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .split-bottom, .split-bottom-wrap {
            display: flex;
            gap: 8px;
        }
        .section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div id="banner">
        <div id="logo">
            <img src="assets/gemini-logo.png" alt="Gemini Logo">
        </div>
        <div class="txt">
            <div class="split-top">
                <div class="line-text">PAKET MAHASISWA</div>
            </div>
            <div class="split-bottom-wrap">
                <div class="split-bottom">
                    <div class="line-text">1 TAHUN</div>
                    <div class="line-text crossed" >
                        <span class="sup">RP</span>900.000
                        <div id="line" class="line"></div>
                    </div>
                </div>
                <div class="line-text gratis">GRATIS</div>
            </div>
        </div>
        <div class="link"></div>
    </div>
    <script>
        gsap.registerPlugin(SplitText);

        // Split text into characters for animation
        let splitTop = SplitText.create(".split-top", { type: "words", linesClass: "line-text" });
        let splitBottom = SplitText.create(".split-bottom", { type: "words" });

        const tl = gsap.timeline({
            onComplete: () => {
                setTimeout(() => {
                    loopTl.play();
                }, 1000);
            }
        });

        tl
        .from(splitTop.words, {
            scale: 1.2, opacity: 0, stagger: {
                amount: 0.4, from: "start", ease: "cubic-bezier(0.4, 0, 0.2, 1)"
            }
        })
        .from(splitBottom.words, {
            scale: 1.2, opacity: 0, stagger: {
                amount: 1, from: "start", ease: "cubic-bezier(0.4, 0, 0.2, 1)"
            }
        })
        .to("#line", { duration: 0.5, clipPath: "inset(0% 0% 0% 0%)", ease: "cubic-bezier(0.4, 0, 0.2, 1)" }, "+=0.2")
        .from(".gratis", {
            scale: 1.2, opacity: 0, stagger: {
                amount: 0.2, from: "start", ease: "cubic-bezier(0.4, 0, 0.2, 1)"
            }
        })
        ;

        tl.play();

        const loopTl = gsap.timeline({ paused: true, repeat: -1, repeatDelay: 3 });

        loopTl
        .set("#line", { clipPath: "inset(0% 100% 0% 0%)" }) 
        .to("#line", { duration: 0.5, clipPath: "inset(0% 0% 0% 0%)", ease: "cubic-bezier(0.4, 0, 0.2, 1)" }, "+=0.5");

        document.querySelector(".link").addEventListener("click", () => {
            window.open("https://gemini.google/id/students/?hl=id", "_blank");
        });
    </script>
</body>
</html>
