<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ad.orientation" content="portrait,landscape">
    <meta name="google" content="notranslate" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>300x50 Banner</title>
    
    <!-- Required Google Ads clickTag definition -->
    <script type="text/javascript">
        var clickTag = "https://gemini.google/id/students/?hl=id";
    </script>

    <!-- Official Google Ads Exit API Script -->
    <script src="https://tpc.googlesyndication.com/pagead/gadgets/html5/api/exitapi.js" type="text/javascript"></script>

    <script src="js/gsap.min.js"></script>
    <script src="js/SplitText.min.js"></script>
    
    <style>
        @font-face {
            font-family: "Google Sans Flex";
            src: url("assets/google-sans-flex.woff2") format("woff2");
            font-weight: 100 1000;
            font-style: normal;
        }
        :root {
            --google-blue: #4285F4;
            --google-green: #0F9D58;
            --google-red: #DB4437;
            --google-yellow: #F4B400;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: "Google Sans Flex", sans-serif;
            font-optical-sizing: auto;
        }
        a {
            color: inherit;
            text-decoration: inherit;
        }
        img {
            width: 100%;
        }
        #banner {
            width: 300px;
            height: 50px;
            background: #000;
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            gap: 15px;
        }
        #logo {
            width: 90px;
        }
        .txt {
            color: #fff;
            font-variation-settings: "opsz" 144, "wdth" 47, "wght" 700, "GRAD" 37, "ROND" 0, "slnt" 0;
            font-size: 20px;
            text-align: center;
            line-height: 0.9;
            margin: 15px 0;
        }
        .sup {
            font-size: 10px;
            vertical-align: super;
        }
        .crossed {
            position: relative;
        }
        .line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            margin: 0 auto;
            width: 100%;
            height: 3px;
            background-color: #E81C53;
            transform: rotate(-6deg) translate(2px, -2px);
            border-radius: 2px;
        }
        #line {
            clip-path: inset(0% 100% 0% 0%);
        }
        .link {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .split-bottom, .split-bottom-wrap {
            display: flex;
            gap: 4px;
        }
    </style>
</head>
<body>
    <div id="banner">
        <div id="logo">
            <img src="assets/gemini-logo.png" alt="Gemini Logo" loading="lazy">
        </div>
        <div class="txt">
            <div class="split-top">

                <div class="line-text">PAKET MAHASISWA</div>
            </div>
            <div class="split-bottom-wrap">
                <div class="split-bottom">
                    <div class="line-text">1 TAHUN</div>
                    <div class="line-text crossed" >
                        <span class="sup">RP</span>900.000
                        <div id="line" class="line"></div>
                    </div>
                </div>
                <div class="line-text gratis">GRATIS</div>
            </div>
        </div>
        <div class="link"></div>
    </div>
    <script>
        gsap.registerPlugin(SplitText);

        // Split text into characters for animation
        let splitTop = SplitText.create(".split-top", { type: "words", linesClass: "line-text" });
        let splitBottom = SplitText.create(".split-bottom", { type: "words" });

        const tl = gsap.timeline({
            onComplete: () => {
                setTimeout(() => {
                    loopTl.play();
                }, 1000);
            }
        });

        tl
        .from(splitTop.words, {
            scale: 1.2, opacity: 0, stagger: {
                amount: 0.4, from: "start", ease: "cubic-bezier(0.4, 0, 0.2, 1)"
            }
        })
        .from(splitBottom.words, {
            scale: 1.2, opacity: 0, stagger: {
                amount: 1, from: "start", ease: "cubic-bezier(0.4, 0, 0.2, 1)"
            }
        })
        .to("#line", { duration: 0.5, clipPath: "inset(0% 0% 0% 0%)", ease: "cubic-bezier(0.4, 0, 0.2, 1)" }, "+=0.2")
        .from(".gratis", {
            scale: 1.2, opacity: 0, stagger: {
                amount: 0.2, from: "start", ease: "cubic-bezier(0.4, 0, 0.2, 1)"
            }
        })
        ;

        tl.play();

        const loopTl = gsap.timeline({ paused: true, repeat: -1, repeatDelay: 3 });

        loopTl
        .set("#line", { clipPath: "inset(0% 100% 0% 0%)" }) 
        .to("#line", { duration: 0.5, clipPath: "inset(0% 0% 0% 0%)", ease: "cubic-bezier(0.4, 0, 0.2, 1)" }, "+=0.5");

        const banner = document.getElementById("banner");
        banner.addEventListener("mouseenter", () => {
            gsap.to(".cta", {
            "--glow-opacity": 1,
            scale: 1.03,
            duration: 0.3,
            overwrite: "auto"
            });
            gsap.to(".cta", {
                "--glow-opacity": 0,
                scale: 1,
                duration: 0.5,
                delay: 0.5,
                overwrite: "auto"
            });
        });

        document.querySelector(".link").addEventListener("click", () => {
            ExitApi.exit();
        });
    </script>
</body>
</html>
